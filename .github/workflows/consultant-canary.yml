# The consultant canary — every 6 hours against the live demo.
#
# Why this exists rather than a promote-time check alone:
# CREWCHIEF_ROUNDTRIP_GATE_DESIGN.md's central finding is that the §22 outage
# arrived WITHOUT a deploy. The API key went stale while the code sat still.
# A gate that only runs on promote is structurally incapable of catching it,
# because nobody was promoting.
#
# Runs against the LIVE demo, not a candidate build. The demo is linked from
# David's portfolio during an active job search, so the thing worth monitoring
# is what a recruiter would actually load.
#
# Cost: four Gemini chat calls a day, ~1.3s each. That is the price of knowing.
name: Consultant canary

on:
  schedule:
    # 00:00, 06:00, 12:00, 18:00 UTC.
    - cron: '0 */6 * * *'
  workflow_dispatch: # so it can be run by hand after a suspected outage

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ask the live consultant a real question
        id: canary
        env:
          CONSULTANT_HEALTH_SECRET: ${{ secrets.CONSULTANT_HEALTH_SECRET }}
        # `continue-on-error` so the exit code can be inspected below rather
        # than ending the job. The distinction between "ours" and "Google's"
        # is the whole point and must survive into the alert.
        continue-on-error: true
        run: |
          node scripts/consultant-canary.mjs https://crewchief-demo.davidmasterson.co
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Interpret the result
        run: |
          case "${{ steps.canary.outcome }}" in
            success)
              echo "Consultant is answering." ;;
            *)
              echo "::error::The consultant canary did not report good."
              echo "Exit 1 = ours, fix it. Exit 2 = Gemini unavailable, note it."
              echo "Exit 3 = the canary could not run; check CONSULTANT_HEALTH_SECRET."
              exit 1 ;;
          esac
